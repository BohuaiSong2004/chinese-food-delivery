spring:
  application:
    name: wokflow-mockpay
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mockpay}
    username: ${DB_USER:wokflow}
    password: ${DB_PASSWORD:wokflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

server:
  port: ${PORT:8090}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

mockpay:
  secret-key: ${MOCKPAY_SECRET_KEY:sk_test_wokflow_dev}
  webhook-secret: ${MOCKPAY_WEBHOOK_SECRET:whsec_wokflow_dev}
  webhook-url: ${MOCKPAY_WEBHOOK_URL:http://localhost:8080/api/payments/webhook}
  public-url: ${MOCKPAY_PUBLIC_URL:http://localhost:8090}
  allowed-return-origins: ${MOCKPAY_ALLOWED_RETURN_ORIGINS:http://localhost:5173,http://localhost:8000}
  # Chaos for tests: deliver this fraction of events twice.
  duplicate-rate: ${MOCKPAY_DUPLICATE_RATE:0}
