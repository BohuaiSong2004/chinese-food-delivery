spring:
  application:
    name: wokflow-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wokflow}
    username: ${DB_USER:wokflow}
    password: ${DB_PASSWORD:wokflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  elasticsearch:
    uris: ${ES_URL:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 10s
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    elasticsearch:
      enabled: false   # search degrades to Postgres when ES is down; do not fail readiness

springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs

wokflow:
  public-origin: ${PUBLIC_ORIGIN:http://localhost:5173}
  jwt:
    issuer: ${JWT_ISSUER:wokflow}
    private-key-file: ${JWT_PRIVATE_KEY_FILE:}
    generate-if-missing: ${JWT_GENERATE_IF_MISSING:false}   # local stacks only; production mounts a secret
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  payments:
    base-url: ${MOCKPAY_URL:http://localhost:8090}
    secret-key: ${MOCKPAY_SECRET_KEY:sk_test_wokflow_dev}
    webhook-secret: ${MOCKPAY_WEBHOOK_SECRET:whsec_wokflow_dev}
    webhook-tolerance: 5m
    payment-window: ${PAYMENT_WINDOW:15m}
  search:
    index-alias: ${ES_INDEX_ALIAS:dishes}
    reindex-on-startup: ${ES_REINDEX_ON_STARTUP:true}
  hot-menu:
    window-hours: 24
    top-n: 6
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  seed:
    demo: ${SEED_DEMO:true}
  outbox:
    retention: 2d

logging:
  level:
    org.elasticsearch.client: warn
