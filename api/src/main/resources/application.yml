spring:
  application:
    name: wokflow-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wokflow}
    username: ${DB_USER:wokflow}
    password: ${DB_PASSWORD:wokflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      connection-timeout: 5000
      validation-timeout: 2000
      data-source-properties:
        # A hung database must fail requests, not hold them forever: no query here needs 10 s.
        # (Flyway shares this pool; split it out before adding a long-running migration.)
        socketTimeout: 10
        connectTimeout: 3
        tcpKeepAlive: true
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  elasticsearch:
    uris: ${ES_URL:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 10s
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db   # take a replica out of the load balancer when its database is gone
  health:
    elasticsearch:
      enabled: false   # search degrades to Postgres when ES is down; do not fail readiness
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # buckets, so Prometheus can compute p95 across both replicas
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s
    tags:
      application: wokflow-api

springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs

wokflow:
  public-origin: ${PUBLIC_ORIGIN:http://localhost:5173}
  jwt:
    issuer: ${JWT_ISSUER:wokflow}
    private-key: ${JWT_PRIVATE_KEY:}             # PEM text (e.g. injected from a secrets manager), or:
    private-key-file: ${JWT_PRIVATE_KEY_FILE:}
    generate-if-missing: ${JWT_GENERATE_IF_MISSING:false}   # local stacks only; production mounts a secret
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    previous-public-keys: ${JWT_PREVIOUS_PUBLIC_KEYS:}          # retired keys still accepted after a rotation
    previous-public-keys-file: ${JWT_PREVIOUS_PUBLIC_KEYS_FILE:}
  payments:
    base-url: ${MOCKPAY_URL:http://localhost:8090}
    secret-key: ${MOCKPAY_SECRET_KEY:sk_test_wokflow_dev}
    webhook-secret: ${MOCKPAY_WEBHOOK_SECRET:whsec_wokflow_dev}
    webhook-tolerance: 5m
    payment-window: ${PAYMENT_WINDOW:15m}
    provider: ${PAYMENT_PROVIDER:mockpay}
    stripe:   # used when PAYMENT_PROVIDER=stripe; test-mode keys only (sk_test_..., whsec_...)
      base-url: ${STRIPE_API_URL:https://api.stripe.com}
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  search:
    index-alias: ${ES_INDEX_ALIAS:dishes}
    reindex-on-startup: ${ES_REINDEX_ON_STARTUP:true}
  hot-menu:
    window-hours: 24
    top-n: 6
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  seed:
    demo: ${SEED_DEMO:true}
  outbox:
    retention: 2d
  orders:
    # Leaves pool connections for webhooks and reads during a rush; extra placements queue in memory instead.
    placement-concurrency: ${ORDER_PLACEMENT_CONCURRENCY:12}
    placement-wait: 10s
  delivery:
    fee-per-km-cents: ${DELIVERY_FEE_PER_KM_CENTS:60}
    free-km: ${DELIVERY_FREE_KM:2}
  images:
    store: ${IMAGE_STORE:local}               # local | s3
    dir: ${IMAGE_DIR:./data/images}
    bucket: ${IMAGE_BUCKET:}
    prefix: ${IMAGE_PREFIX:images/}
    region: ${AWS_REGION:us-west-2}
    endpoint: ${IMAGE_S3_ENDPOINT:}             # only for S3-compatible test servers
    public-base: ${IMAGE_PUBLIC_BASE:/api/images}
    generate-demo: ${IMAGE_GENERATE_DEMO:true}   # draw illustrations for seeded dishes without a photo

logging:
  level:
    org.elasticsearch.client: warn
