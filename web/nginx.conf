# Serves the SPA and proxies /api to the API replicas (Docker DNS returns every replica).
# `resolve` re-reads Docker DNS, so restarted or rescaled API containers are picked up without reloading nginx.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream api {
    zone api 64k;
    server api:8080 resolve max_fails=2 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Live order status: no buffering, long reads, and retry on the other replica if one is down.
    location ~ ^/api/.*/events$ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # nginx is the edge: overwrite, never append
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Photo uploads are the only large request bodies (the API re-checks the 6 MB limit itself).
    location ~ ^/api/merchant/(dishes|restaurants)/[0-9]+/image$ {
        client_max_body_size 8m;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Only a connection failure means a replica is down. A 503 is the API's own backpressure
        # ("busy, retry after 1 s"): passing it through matters, because counting it as a failure
        # made nginx mark both replicas down during a rush and turn every request into a 502.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # add_header in a location replaces the server's list, so the page needs its own copy
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        try_files $uri /index.html;
    }
}
