# Full local stack: http://localhost:8000 (web), MockPay checkout on http://localhost:8090,
# outgoing mail (password resets) on http://localhost:8025.
# Data lives in named volumes and survives restarts; `docker compose down -v` resets everything.
name: wokflow

x-api-env: &api-env
  DB_URL: jdbc:postgresql://postgres:5432/wokflow
  DB_USER: wokflow
  DB_PASSWORD: wokflow
  REDIS_HOST: redis
  ES_URL: http://elasticsearch:9200
  PUBLIC_ORIGIN: http://localhost:8000
  MOCKPAY_URL: http://mockpay:8090
  MOCKPAY_SECRET_KEY: sk_test_wokflow_local
  MOCKPAY_WEBHOOK_SECRET: whsec_wokflow_local
  JWT_PRIVATE_KEY_FILE: /keys/jwt.pem
  IMAGE_DIR: /data/images
  SPRING_MAIL_HOST: mailpit   # password-reset mail; read it at http://localhost:8025
  SPRING_MAIL_PORT: "1025"
  JWT_GENERATE_IF_MISSING: "true"
  FORWARD_HEADERS_STRATEGY: native   # trust X-Forwarded-For from nginx on the private network
  SEED_LOADTEST_USERS: ${SEED_LOADTEST_USERS:-0}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-30}                           # per replica
  ORDER_PLACEMENT_CONCURRENCY: ${ORDER_PLACEMENT_CONCURRENCY:-12}  # placements in flight per replica (bulkhead)
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}                  # e.g. a Flight Recorder recording while load testing
  JAVA_OPTS: -Xmx384m -XX:+ExitOnOutOfMemoryError

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: wokflow
      POSTGRES_PASSWORD: wokflow
      POSTGRES_DB: wokflow
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/10-mockpay.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wokflow -d wokflow && psql -U wokflow -d mockpay -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # local only; see infra/ for the managed cluster
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Single local node: don't refuse shards because the developer's disk is nearly full.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  mockpay:
    build:
      context: .
      dockerfile: mockpay/Dockerfile
    image: wokflow-mockpay:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mockpay
      DB_USER: wokflow
      DB_PASSWORD: wokflow
      MOCKPAY_SECRET_KEY: sk_test_wokflow_local
      MOCKPAY_WEBHOOK_SECRET: whsec_wokflow_local
      MOCKPAY_WEBHOOK_URL: http://web:8000/api/payments/webhook
      MOCKPAY_PUBLIC_URL: http://localhost:8090
      MOCKPAY_ALLOWED_RETURN_ORIGINS: http://localhost:8000
      MOCKPAY_DUPLICATE_RATE: ${MOCKPAY_DUPLICATE_RATE:-0}
      JAVA_OPTS: -Xmx256m
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29   # catches outgoing mail locally; nothing leaves the machine
    ports:
      - "8025:8025"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: wokflow-api:local
    deploy:
      replicas: 2   # two replicas: live status must reach clients on either one
    environment: *api-env
    volumes:
      - jwtkeys:/keys
      - images:/data/images   # dish photos, shared by both replicas
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: web
    image: wokflow-web:local
    ports:
      - "8000:8000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Monitoring, off by default: docker compose --profile observability up -d
  prometheus:
    profiles: [observability]
    image: quay.io/prometheus/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local only: open the dashboard without signing in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-wokflow-local}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wokflow.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  esdata:
  jwtkeys:
  images:
  promdata:
  grafanadata:
