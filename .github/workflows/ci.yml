name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration on Postgres, Redis, Elasticsearch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pre-pull test images
        run: |
          docker pull -q postgres:18.7-alpine &
          docker pull -q redis:8.8.4-alpine &
          docker pull -q elasticsearch:9.5.5 &
          wait
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          p = 'api/target/site/jacoco/jacoco.csv'
          if os.path.exists(p):
              rows = list(csv.DictReader(open(p)))
              t = lambda k: sum(int(r[k]) for r in rows)
              print(f"API coverage: lines {t('LINE_COVERED')/(t('LINE_COVERED')+t('LINE_MISSED')):.1%}, "
                    f"branches {t('BRANCH_COVERED')/(t('BRANCH_COVERED')+t('BRANCH_MISSED')):.1%}")
          PY
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
