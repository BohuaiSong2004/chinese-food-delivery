# Scrapes every API replica: Docker's DNS returns one A record per replica of the "api" service.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: wokflow-api
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8080
        refresh_interval: 15s
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
