# Thresholds come from docs/performance.md: they sit well above what the local stack measures under load,
# so a firing alert means something changed, not that the laptop is busy.
groups:
  - name: wokflow
    rules:
      - alert: ApiReplicaDown
        expr: up{job="wokflow-api"} == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "API replica {{ $labels.instance }} is not answering /actuator/prometheus"

      - alert: ServerErrors
        expr: |
          sum(rate(http_server_requests_seconds_count{job="wokflow-api",status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="wokflow-api"}[5m])) > 0.01
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "More than 1% of API requests fail with 5xx"

      - alert: SlowOrderPlacement
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="wokflow-api",method="POST",uri="/api/orders"}[5m]))) > 0.5
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "p95 of POST /api/orders is above 500 ms"

      - alert: OutboxLagging
        expr: max(wokflow_outbox_lag_seconds{job="wokflow-api"}) > 30
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Outbox events are {{ $value | humanizeDuration }} behind: search, live status and dispatch are stale"

      - alert: PaymentWebhooksRejected
        expr: sum(increase(http_server_requests_seconds_count{job="wokflow-api",uri=~"/api/payments(/stripe)?/webhook",status="400"}[15m])) > 5
        labels: { severity: ticket }
        annotations:
          summary: "Payment webhooks are failing signature checks (secret rotation half done?)"

      - alert: SearchOnFallback
        expr: sum(increase(wokflow_search_fallback_total{job="wokflow-api"}[10m])) > 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Search has been answering from Postgres for 10 minutes: Elasticsearch is down or unhealthy"
